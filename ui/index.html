<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CC 工具箱 · JSON 解析</title>
<link rel="icon" href="assets/plugin.svg" type="image/svg+xml" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">CC</span><span class="title">JSON 解析</span></div>
    <div class="actions" id="actions">
      <button data-act="sample">示例</button>
      <button data-act="format">格式化</button>
      <button data-act="minify">压缩</button>
      <button data-act="validate">校验</button>
      <button data-act="clear">清空</button>
      <button data-act="find">查找</button>
      <button data-act="filter">高级筛选</button>
      <button data-act="export">导出 CSV</button>
      <button data-act="theme" title="切换明暗">主题</button>
    </div>
  </header>

  <main class="split">
    <section class="pane editor-pane">
      <div class="pane-head"><span>JSON</span><span class="hint" id="editor-hint"></span></div>
      <div class="editor-wrap">
        <div class="gutter" id="gutter">1</div>
        <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder='在此粘贴 JSON，例如：{"id":1,"name":"demo","tags":["a","b"]}'></textarea>
      </div>
    </section>

    <section class="pane grid-pane">
      <div class="pane-head"><span>GRID</span><span class="hint" id="grid-hint"></span></div>
      <div class="grid-wrap" id="grid"></div>
    </section>
  </main>

  <footer class="statusbar">
    <span id="status">就绪</span>
    <span class="status-right" id="stats"></span>
  </footer>
</div>

<div class="findbar" id="findbar" hidden>
  <input id="find-input" placeholder="查找…" />
  <button id="find-prev" title="上一个">↑</button>
  <button id="find-next" title="下一个">↓</button>
  <button id="find-close" title="关闭">×</button>
</div>

<div class="filter-panel" id="filter-panel" hidden>
  <div class="filter-head">
    <strong>高级筛选</strong>
    <span class="filter-tip">参数 data / _（lodash）；返回新的 JSON，例如 <code>data.filter(x =&gt; x.score &gt; 60)</code></span>
  </div>
  <textarea id="filter-code" spellcheck="false">// 示例：只保留 score > 60 的项
return Array.isArray(data) ? data.filter((x) => x && x.score > 60) : data;</textarea>
  <div class="filter-actions">
    <button id="filter-apply">应用</button>
    <button id="filter-reset">还原</button>
    <button id="filter-close">关闭</button>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><span id="modal-title">详情</span><button id="modal-close">×</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="assets/lodash.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
