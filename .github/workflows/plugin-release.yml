name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-cli-v0.1.9
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: dotnet publish sidecar/InvoiceSidecarNoWf -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$(node -p "require('./manifest.json').version") -o bin/win-x64 && npm install --no-save adm-zip && node scripts/package-native.mjs
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.9
      build-matrix: '{"include":[{"runner":"windows-2022","target":"windows-x64"}]}'