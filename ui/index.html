<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CC 工具箱</title>
<link rel="icon" href="assets/plugin.svg" type="image/svg+xml" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="tools/jsondiff/style.css" />
<link rel="stylesheet" href="tools/drawboard/style.css" />
<link rel="stylesheet" href="tools/settings/style.css" />
<link rel="stylesheet" href="tools/quicksheet/style.css" />
<link rel="stylesheet" href="tools/home/style.css" />
<link rel="stylesheet" href="tools/invoice/style.css" />
<link rel="stylesheet" href="tools/xml/style.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">CC</span><span class="title" id="tool-title">JSON 解析</span></div>
    <div class="actions" id="actions">
      <button data-act="sample">示例</button>
      <button data-act="format">格式化</button>
      <button data-act="minify">压缩</button>
      <button data-act="validate">校验</button>
      <button data-act="clear">清空</button>
      <button data-act="find">查找</button>
      <button data-act="wrap" class="active" title="按当前宽度自动换行">换行</button>
      <button data-act="filter">高级筛选</button>
      <button data-act="export">导出 CSV</button>
      <button data-act="theme" title="切换明暗">主题</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="sidebar" aria-label="工具"></aside>

    <div class="main">
      <section class="tool-pane active" id="tool-json">
        <nav class="tabbar" id="tabbar">
          <div class="tabs" id="tabs"></div>
          <button class="tab-add" id="tab-add" type="button" title="新增解析窗口">＋</button>
        </nav>
        <main class="split" id="split">
          <section class="pane editor-pane">
            <div class="pane-head"><span>JSON</span><span class="hint" id="editor-hint"></span></div>
            <div class="editor-wrap">
              <div class="gutter" id="gutter">1</div>
              <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder='在此粘贴 JSON，例如：{"id":1,"name":"demo","tags":["a","b"]}'></textarea>
            </div>
          </section>
          <div class="splitter" id="splitter" role="separator" tabindex="0" aria-label="调整编辑区大小" aria-controls="editor"
            aria-orientation="vertical" aria-valuemin="20" aria-valuemax="80" aria-valuenow="40" title="拖动或用方向键调整，双击恢复默认"></div>
          <section class="pane grid-pane">
            <div class="pane-head"><span>GRID</span><span class="hint" id="grid-hint"></span></div>
            <nav id="grid-focus" class="grid-focus" aria-label="当前查看位置" hidden>
              <button type="button" data-focus-back>返回</button>
              <button type="button" data-focus-root>回到根表</button>
              <span id="grid-focus-path"></span>
            </nav>
            <div class="grid-wrap" id="grid"></div>
          </section>
        </main>
      </section>

    </div>
  </div>

  <footer class="statusbar">
    <span id="status">就绪</span>
    <span id="json-save-state" title="文档自动保存状态"></span>
    <span class="status-right" id="stats"></span>
  </footer>
</div>

<div class="findbar" id="findbar" hidden>
  <input id="find-input" placeholder="查找…" />
  <button id="find-prev" title="上一个">↑</button>
  <button id="find-next" title="下一个">↓</button>
  <button id="find-close" title="关闭">×</button>
</div>

<div class="filter-panel" id="filter-panel" hidden>
  <div class="filter-head">
    <strong>高级筛选</strong>
    <span class="filter-tip">参数 data / _（lodash）；返回新的 JSON，例如 <code>data.filter(x =&gt; x.score &gt; 60)</code></span>
  </div>
  <textarea id="filter-code" spellcheck="false">// 示例：只保留 score > 60 的项
return Array.isArray(data) ? data.filter((x) => x && x.score > 60) : data;</textarea>
  <div class="filter-actions">
    <button id="filter-apply">应用</button>
    <button id="filter-reset">还原</button>
    <button id="filter-close">关闭</button>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><span id="modal-title">详情</span><button id="modal-close">×</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="assets/lodash.min.js"></script>
<script src="assets/xlsx.full.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
